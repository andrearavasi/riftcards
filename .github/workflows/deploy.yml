name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # O 'master', a seconda della tua branch principale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25' # Usa una versione LTS di Node
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build # Questo esegue la build usando adapter-static
        env:
          # Questo passa il nome del repo come variabile d'ambiente
          # che il 'base' path in svelte.config.js può usare (opzionale se l'hai hardcodato)
          BASE_PATH: /${{ github.event.repository.name }} 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # Assicurati che corrisponda alla cartella 'pages' in svelte.config.js

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
